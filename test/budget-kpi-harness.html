<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>Test BudgetTable — kafle KPI + stopka zafiltrowana</title>
<!--
  Uruchomienie: SKOPIUJ do apps/frontend/ i otworz przez dev serwer:
    cp test/budget-kpi-harness.html apps/frontend/_tmp-budget-kpi.html
    cd apps/frontend && npx vite --port 5174
    http://localhost:5174/_tmp-budget-kpi.html
  (przez /@fs/ nie zadziala — Vite nie przepisuje wtedy bare importow `react`)

  Sprawdza:
    1. bez baseline (accepted=false) kafel ma TYLKO wiersz "Oferta"
    2. z baseline kafel ma "Oferta" + "Rzeczywiste", rzeczywiste = oferta + purchaseDelta
    3. brak zakupow (purchaseDelta=0) => rzeczywiste == oferta co do grosza
    4. filtr kolumnowy dokłada trzeci wiersz "Zafiltrowane" (kursywa, -2px)
    5. stopka "Wartosc zafiltrowana" sumuje widoczne wiersze i ma tyle komorek co naglowek
--></head>
<body style="margin:0;background:#0b1220">
<div id="root" style="height:70vh"></div>
<pre id="out" style="position:fixed;bottom:0;left:0;right:0;max-height:30vh;overflow:auto;font-family:monospace;font-size:11px;color:#7dd3fc;background:#000e;padding:8px;z-index:99999;margin:0"></pre>
<script type="module">
  import '/src/index.css';
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import BudgetTable from '/src/components/shared/wbs/BudgetTable.jsx';

  const results = [];
  const assert = (name, cond, detail = '') => results.push({ name, pass: !!cond, detail });
  const render = () => {
    const failed = results.filter(r => !r.pass);
    document.getElementById('out').textContent =
      results.map(r => `${r.pass ? 'PASS' : 'FAIL'}  ${r.name}${r.detail ? '\n        → ' + r.detail : ''}`).join('\n')
      + `\n\n${results.length - failed.length}/${results.length} PASS`;
    window.__TEST_RESULT__ = { total: results.length, failed: failed.length, results };
  };

  // --- Mock budget-sums: sterowany z testu ---
  let SUMS = { accepted: false, sumWycena: 0, sumZakup: 0, purchaseDelta: 0, purchasedCount: 0 };
  window.fetch = async (url) => {
    if (String(url).includes('/budget-sums')) {
      return { ok: true, json: async () => SUMS };
    }
    return { ok: false, json: async () => ({}) };
  };

  // koszt = unitCost*quantity; cena ofert. = koszt*(1+margin/100), potem rabat wiersza
  const ROWS = [
    { id: 'r1', subjectName: 'Szafa RACK', name: 'Szafa 42U',        type: 'material',  unit: 'szt', unitCost: 4000, quantity: 3, margin: 20, discount: 0, comment: '' },
    { id: 'r2', subjectName: 'Szafa RACK', name: 'Listwa PDU',       type: 'material',  unit: 'szt', unitCost: 500,  quantity: 6, margin: 25, discount: 0, comment: '' },
    { id: 'r3', subjectName: 'Klimatyzacja', name: 'Jednostka 12kW', type: 'equipment', unit: 'szt', unitCost: 18000, quantity: 2, margin: 15, discount: 0, comment: '' },
    { id: 'r4', subjectName: 'Montaz',     name: 'Robocizna',        type: 'work',      unit: 'h',   unitCost: 120,  quantity: 80, margin: 40, discount: 0, comment: '' },
    { id: 'r5', subjectName: 'Montaz',     name: 'Dojazdy',          type: 'fuel',      unit: 'km',  unitCost: 2,    quantity: 900, margin: 10, discount: 0, comment: '' },
  ];

  const root = createRoot(document.getElementById('root'));
  // Kazdy scenariusz dostaje INNY nodeId — useEffect pobierajacy budget-sums ma deps
  // [nodeId, versionId], wiec bez zmiany id nie odpytalby mocka jeszcze raz.
  let scenario = 0;
  const draw = () => root.render(React.createElement(BudgetTable, {
    rows: ROWS, nodeId: `n${++scenario}`, versionId: 'v1',
    onFieldChange: () => {}, onDeleteRow: () => {},
    discountPercent: '', discountAmount: '',
    onDiscountPercentChange: () => {}, onDiscountAmountChange: () => {},
  }));

  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const $$ = (s) => [...document.querySelectorAll(s)];
  const tileByLabel = (label) =>
    $$('div').find(d => d.className.includes('rounded-xl') && d.firstElementChild?.textContent?.trim().toLowerCase() === label);
  const rowsOf = (tile) => [...tile.children].slice(1).filter(el => el.className.includes('justify-between'));
  const num = (t) => parseFloat(String(t).replace(/[^\d,-]/g, '').replace(/\s/g, '').replace(',', '.'));

  // ── 1. Bez baseline: tylko "Oferta" ────────────────────────────────────────
  SUMS = { accepted: false, sumWycena: 999999, sumZakup: 111111, purchaseDelta: 0, purchasedCount: 0 };
  draw(); await wait(300);

  const kosztTile = tileByLabel('koszt');
  assert('1. kafel Koszt istnieje', !!kosztTile);
  let r = rowsOf(kosztTile);
  assert('1. bez baseline kafel ma 1 wiersz (sama Oferta)', r.length === 1, `wierszy: ${r.length} → ${r.map(x => x.textContent).join(' | ')}`);
  assert('1. wiersz to Oferta', r[0]?.textContent.toLowerCase().includes('oferta'), r[0]?.textContent);
  const ofertaKoszt = num(r[0].lastElementChild.textContent);
  // 12000 + 3000 + 36000 + 9600 + 1800 = 62400
  assert('1. koszt oferty = 62 400', Math.abs(ofertaKoszt - 62400) < 0.01, String(ofertaKoszt));

  // ── 2. Z baseline, zero zakupow: rzeczywiste == oferta ─────────────────────
  SUMS = { accepted: true, sumWycena: 999999, sumZakup: 111111, purchaseDelta: 0, purchasedCount: 0 };
  draw(); await wait(300);
  r = rowsOf(tileByLabel('koszt'));
  assert('2. z baseline kafel ma 2 wiersze', r.length === 2, `wierszy: ${r.length}`);
  assert('2. drugi wiersz to Rzeczywiste', r[1]?.textContent.toLowerCase().includes('rzeczywiste'), r[1]?.textContent);
  const realKoszt = num(r[1].lastElementChild.textContent);
  assert('2. bez zakupow rzeczywiste == oferta (brak rozjazdu)', Math.abs(realKoszt - ofertaKoszt) < 0.01,
    `oferta ${ofertaKoszt} vs rzeczywiste ${realKoszt}`);

  // ── 3. Z zakupami: rzeczywiste = oferta + purchaseDelta ────────────────────
  SUMS = { accepted: true, sumWycena: 999999, sumZakup: 111111, purchaseDelta: -5000, purchasedCount: 2 };
  draw(); await wait(300);
  r = rowsOf(tileByLabel('koszt'));
  const realKoszt2 = num(r[1].lastElementChild.textContent);
  assert('3. rzeczywiste = oferta + purchaseDelta', Math.abs(realKoszt2 - (ofertaKoszt - 5000)) < 0.01,
    `oczekiwano ${ofertaKoszt - 5000}, jest ${realKoszt2}`);

  // ── 4. Stopka: liczba komorek == liczba kolumn naglowka ────────────────────
  const headCells = $$('thead tr')[0].children.length;
  const footCells = $$('tfoot tr')[0].children.length;
  assert('4. stopka ma tyle komorek co naglowek', headCells === footCells, `naglowek ${headCells}, stopka ${footCells}`);
  // pl-PL separuje tysiace TWARDA spacja (U+00A0) — normalizuj przed porownaniem
  const norm = (t) => String(t).replace(/ /g, ' ');
  const footText = norm($$('tfoot tr')[0].textContent);
  assert('4. stopka ma opis "Wartość zafiltrowana"', footText.includes('Wartość zafiltrowana'), footText);
  assert('4. stopka liczy 5 z 5 pozycji', footText.includes('5 z 5 poz.'), footText);
  assert('4. stopka sumuje koszt 62 400', footText.includes('62 400,00'), footText);

  // ── 5. Filtr: trzeci wiersz "Zafiltrowane", kursywa, -2px ──────────────────
  const typFilter = $$('thead tr')[1].children[3].querySelector('button'); // dropdown kolumny Typ
  typFilter.click(); await wait(100);
  const matOpt = $$('input[type=checkbox]').map(cb => cb.closest('label')).find(l => l?.textContent.trim().toLowerCase().startsWith('materia'));
  matOpt.querySelector('input').click(); await wait(300);

  r = rowsOf(tileByLabel('koszt'));
  assert('5. przy filtrze kafel ma 3 wiersze', r.length === 3, `wierszy: ${r.length} → ${r.map(x => x.textContent).join(' | ')}`);
  const zafRow = r[2];
  assert('5. trzeci wiersz to Zafiltrowane', zafRow?.textContent.toLowerCase().includes('zafiltrowane'), zafRow?.textContent);
  const zafKoszt = num(zafRow.lastElementChild.textContent);
  assert('5. zafiltrowany koszt = 15 000 (2 pozycje material)', Math.abs(zafKoszt - 15000) < 0.01, String(zafKoszt));

  const cs = getComputedStyle(zafRow);
  assert('5. wiersz jest kursywa', cs.fontStyle === 'italic', cs.fontStyle);
  const lblPx = parseFloat(getComputedStyle(zafRow.firstElementChild).fontSize);
  const valPx = parseFloat(getComputedStyle(zafRow.lastElementChild).fontSize);
  const lblRef = parseFloat(getComputedStyle(r[0].firstElementChild).fontSize);
  const valRef = parseFloat(getComputedStyle(r[0].lastElementChild).fontSize);
  assert('5. etykieta o 2px mniejsza', Math.abs((lblRef - lblPx) - 2) < 0.51, `${lblRef}px → ${lblPx}px`);
  assert('5. wartość o 2px mniejsza', Math.abs((valRef - valPx) - 2) < 0.51, `${valRef}px → ${valPx}px`);

  assert('5. stopka po filtrze liczy 2 z 5', norm($$('tfoot tr')[0].textContent).includes('2 z 5 poz.'), norm($$('tfoot tr')[0].textContent));
  assert('5. stopka po filtrze sumuje koszt 15 000', norm($$('tfoot tr')[0].textContent).includes('15 000,00'), norm($$('tfoot tr')[0].textContent));

  // ── 6. Zdjecie filtra: trzeci wiersz znika ─────────────────────────────────
  const clearBtn = $$('button').find(b => b.textContent.trim() === 'wyczyść');
  clearBtn.click(); await wait(300);
  r = rowsOf(tileByLabel('koszt'));
  assert('6. bez filtra wiersz Zafiltrowane znika', r.length === 2, `wierszy: ${r.length}`);

  render();
</script>
</body>
</html>

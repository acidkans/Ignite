<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gigatel ERP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Gigatel ERP</title>
  </head>
  <body spellcheck="true">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        function applySpellcheck(el) {
          if (
            (el.tagName === 'INPUT' && (el.type === 'text' || el.type === '')) ||
            el.tagName === 'TEXTAREA' ||
            el.getAttribute('contenteditable') === 'true'
          ) {
            el.setAttribute('spellcheck', 'true');
          }
        }
        var observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (m) {
            m.addedNodes.forEach(function (node) {
              if (node.nodeType !== 1) return;
              applySpellcheck(node);
              node.querySelectorAll &&
                node.querySelectorAll('input[type="text"], input:not([type]), textarea, [contenteditable="true"]')
                  .forEach(applySpellcheck);
            });
          });
        });
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
    <!-- Dev-tracker tylko na desktopie (>=1024px) — na mobile/tablet widget nie da się przenieść i zasłania UI -->
    <script>
      if (window.innerWidth >= 1024) {
        var dt = document.createElement('script');
        dt.src = 'https://dev-tracker.gigatel.org/widget.js';
        dt.setAttribute('data-project', 'ignite');
        document.body.appendChild(dt);
      }
    </script>
  </body>
</html>
